<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sign in or create an account with Omkar Enterprises to save delivery addresses, track search history, and schedule parcel pickups.">
  <title>Login / Register – Omkar Enterprises</title>

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- Injected Header -->
  <header class="header" id="site-header"></header>

  <main class="page-content py-10" id="main-content">
    <div class="container max-w-md">
      
      <div class="card p-6 sm:p-8 shadow-lg">
        
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="Omkar Enterprises" width="140" class="mx-auto mb-3">
          <h1 class="text-2xl font-extrabold" id="auth-heading">Welcome Back</h1>
          <p class="text-xs text-secondary mt-1">
            Access your saved consignee addresses, search history, and pickup requests.
          </p>
        </div>

        <!-- Google 1-Tap Sign-In -->
        <button type="button" id="google-signin-btn" class="btn btn-outline btn-block mb-4 flex items-center justify-center gap-2">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span class="font-semibold text-sm">Continue with Google</span>
        </button>

        <div class="relative flex py-2 items-center my-3">
          <div class="flex-grow border-t border-border"></div>
          <span class="flex-shrink mx-4 text-xs text-tertiary">or with email</span>
          <div class="flex-grow border-t border-border"></div>
        </div>

        <!-- Segmented Auth Tabs -->
        <div class="segmented-tabs w-full mb-6">
          <button type="button" id="tab-btn-login" class="acc-tab-btn active flex-1 justify-center">
            Sign In
          </button>
          <button type="button" id="tab-btn-register" class="acc-tab-btn flex-1 justify-center">
            Register
          </button>
        </div>

        <!-- Form 1: Login -->
        <form id="login-form" novalidate>
          <div class="mb-4">
            <label for="login-email" class="form-label font-bold text-xs mb-1">Email Address</label>
            <input 
              type="email" 
              id="login-email" 
              class="form-input" 
              placeholder="e.g. name@example.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="mb-2">
            <label for="login-password" class="form-label font-bold text-xs mb-1">Password</label>
            <input 
              type="password" 
              id="login-password" 
              class="form-input" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <div class="text-right mb-5">
            <button type="button" id="forgot-password-trigger" class="text-xs text-primary hover:underline">
              Forgot password?
            </button>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">
            <span>Sign In</span>
          </button>
        </form>

        <!-- Form 2: Register -->
        <form id="register-form" class="hidden" novalidate>
          <div class="mb-3">
            <label for="reg-name" class="form-label font-bold text-xs mb-1">Full Name *</label>
            <input 
              type="text" 
              id="reg-name" 
              class="form-input" 
              placeholder="e.g. Ramesh Patel" 
              required
              autocomplete="name"
            >
          </div>

          <div class="mb-3">
            <label for="reg-email" class="form-label font-bold text-xs mb-1">Email Address *</label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-input" 
              placeholder="e.g. name@example.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="mb-3">
            <label for="reg-phone" class="form-label font-bold text-xs mb-1">Phone Number</label>
            <input 
              type="tel" 
              id="reg-phone" 
              class="form-input" 
              placeholder="e.g. 9876543210"
              autocomplete="tel"
            >
          </div>

          <div class="mb-3">
            <label for="reg-password" class="form-label font-bold text-xs mb-1">Password (min 6 characters) *</label>
            <input 
              type="password" 
              id="reg-password" 
              class="form-input" 
              placeholder="••••••••" 
              minlength="6" 
              required
              autocomplete="new-password"
            >
          </div>

          <div class="mb-5">
            <label for="reg-confirm-password" class="form-label font-bold text-xs mb-1">Confirm Password *</label>
            <input 
              type="password" 
              id="reg-confirm-password" 
              class="form-input" 
              placeholder="••••••••" 
              minlength="6" 
              required
              autocomplete="new-password"
            >
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block">
            <span>Create Account</span>
          </button>
        </form>

        <!-- Guest Notice -->
        <div class="mt-6 pt-4 border-t border-border text-center">
          <p class="text-xs text-secondary">
            Looking to simply check a pincode or browse rates? <br>
            <a href="domestic.html" class="text-primary font-semibold hover:underline">Continue as Guest</a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div class="modal-backdrop" id="forgot-modal" role="dialog" aria-modal="true">
    <div class="modal-dialog max-w-sm">
      <h3 class="font-bold text-base mb-2">Reset Password</h3>
      <p class="text-xs text-secondary mb-4">Enter your registered email address and we will send you a password reset link.</p>
      
      <form id="forgot-form">
        <div class="mb-4">
          <label for="forgot-email" class="form-label font-bold text-xs mb-1">Registered Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="e.g. name@example.com" required>
        </div>

        <div class="flex gap-2">
          <button type="button" id="close-forgot-modal" class="btn btn-ghost flex-1">Cancel</button>
          <button type="submit" id="forgot-submit-btn" class="btn btn-primary flex-1">Send Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Injected Footer & Bottom Dock -->
  <footer class="footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Application Logic -->
  <script type="module">
    import { initUI, showToast } from './js/ui.js';
    import { 
      initAuth, loginWithEmail, registerWithEmail, loginWithGoogle, resetPassword, 
      getCurrentUser, onAuthChange, getUserRole, ADMIN_EMAILS 
    } from './js/auth.js';
    import { getBusinessSettings } from './js/db.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initUI();
      initAuth();

      try {
        const business = await getBusinessSettings();
        const { injectFooter } = await import('./js/ui.js');
        injectFooter(business);
      } catch (e) {}

      const urlParams = new URLSearchParams(window.location.search);
      const returnUrl = urlParams.get('return') || 'account.html';

      // If already logged in, redirect
      onAuthChange(async (user, userData, isAdminUser) => {
        if (user) {
          const role = await getUserRole(user.uid);
          const isUserAdmin = isAdminUser || role === 'admin' || (user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()));
          if (isUserAdmin) {
            window.location.href = (returnUrl === 'account.html' || returnUrl === 'admin/index.html' || returnUrl.includes('admin')) ? 'admin/index.html' : returnUrl;
          } else {
            window.location.href = returnUrl.includes('admin') ? 'account.html' : returnUrl;
          }
        }
      });

      // Tab switching
      const tabLogin = document.getElementById('tab-btn-login');
      const tabRegister = document.getElementById('tab-btn-register');
      const formLogin = document.getElementById('login-form');
      const formRegister = document.getElementById('register-form');
      const heading = document.getElementById('auth-heading');

      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        heading.textContent = 'Welcome Back';
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
        heading.textContent = 'Create an Account';
      });

      // Handle Email Login
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const submitBtn = document.getElementById('login-submit-btn');

        if (!email || !password) {
          showToast('Please enter your email and password.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-sm"></span> Signing in...';

        try {
          await loginWithEmail(email, password);
          showToast('Signed in successfully!', 'success');
          // Redirection handled by onAuthChange
        } catch (err) {
          showToast(err.message || 'Login failed. Please check credentials.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span>';
        }
      });

      // Handle Email Registration
      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;
        const submitBtn = document.getElementById('register-submit-btn');

        if (!name || !email || !password) {
          showToast('Please fill in all required fields.', 'warning');
          return;
        }

        if (password.length < 6) {
          showToast('Password must be at least 6 characters.', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          showToast('Passwords do not match.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-sm"></span> Creating account...';

        try {
          await registerWithEmail(email, password, name, phone);
          showToast('Account created successfully!', 'success');
          // Redirection handled by onAuthChange
        } catch (err) {
          showToast(err.message || 'Registration failed.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Create Account</span>';
        }
      });

      // Google Sign-In
      const googleBtn = document.getElementById('google-signin-btn');
      googleBtn.addEventListener('click', async () => {
        try {
          await loginWithGoogle();
          showToast('Signed in with Google!', 'success');
        } catch (err) {
          showToast(err.message || 'Google sign in failed.', 'error');
        }
      });

      // Forgot Password Modal
      const forgotTrigger = document.getElementById('forgot-password-trigger');
      const forgotModal = document.getElementById('forgot-modal');
      const closeForgot = document.getElementById('close-forgot-modal');
      const forgotForm = document.getElementById('forgot-form');

      forgotTrigger.addEventListener('click', () => {
        forgotModal.classList.add('open');
      });

      closeForgot.addEventListener('click', () => {
        forgotModal.classList.remove('open');
      });

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        if (!email) return;

        try {
          await resetPassword(email);
          showToast('Password reset link sent to your email!', 'success');
          forgotModal.classList.remove('open');
        } catch (err) {
          showToast(err.message || 'Could not send reset email.', 'error');
        }
      });
    });
  </script>
</body>
</html>
